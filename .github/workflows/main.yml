name: Build StoreFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build StoreFlow Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout StoreFlow
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Setup Java 17 for Android/Gradle
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Decode the permanent release keystore from its secret. It must
      # exist at the project root BEFORE prebuild runs, since the
      # withReleaseSigning plugin copies it into android/ during that step.
      # (google-services.json is committed directly to the repo root, not
      # decoded from a secret — see app.json's android.googleServicesFile.)
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.STOREFLOW_KEYSTORE_BASE64 }}" | base64 -d > storeflow-release.keystore

      # 6. Generate native Android project
      # Supabase variables are available during Expo prebuild.
      - name: Generate Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      # 7. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # 8. Build standalone release APK
      # Supabase variables are available while the JS bundle is created.
      # STOREFLOW_RELEASE_* vars are read by plugins/withReleaseSigning.js's
      # generated Gradle code to sign the release build with our permanent
      # keystore instead of a throwaway debug one.
      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          STOREFLOW_RELEASE_STORE_PASSWORD: ${{ secrets.STOREFLOW_KEYSTORE_STORE_PASSWORD }}
          STOREFLOW_RELEASE_KEY_ALIAS: ${{ secrets.STOREFLOW_KEYSTORE_KEY_ALIAS }}
          STOREFLOW_RELEASE_KEY_PASSWORD: ${{ secrets.STOREFLOW_KEYSTORE_KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=2048m"
          JAVA_TOOL_OPTIONS: "-Xmx6g -XX:MaxMetaspaceSize=2048m"
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError"

      # 8. Upload APK
      - name: Upload StoreFlow Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreFlow-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
